name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        run: |
          git remote add space https://eholt723:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/eholt723/traceagent
          git push space main --force

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Pull latest code on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: ssh -i ~/.ssh/key.pem ec2-user@"$EC2_HOST" "cd traceagent && git pull" 2>&1

      - name: Build frontend on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: ssh -i ~/.ssh/key.pem ec2-user@"$EC2_HOST" "cd traceagent/ui && VITE_API_URL='' npm run build" 2>&1

      - name: Restart service on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: ssh -i ~/.ssh/key.pem ec2-user@"$EC2_HOST" "sudo systemctl restart traceagent" 2>&1
